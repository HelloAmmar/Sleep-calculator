<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة دورات النوم</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fa;--surface:#fff;--ink:#1d1a3a;--muted:#6b6890;--line:#dcd8ee;--accent:#5b4bd6;--accent-ink:#fff;--good:#1f9d6b;--cycle:#7d6cf0;--lat:#c9c3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d24;--surface:#1a1740;--ink:#ece9ff;--muted:#a09cc9;--line:#2e2a63;--accent:#9d8fff;--accent-ink:#0f0d24;--good:#4fd1a1;--cycle:#8e7fff;--lat:#3a3573;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0d24;--surface:#1a1740;--ink:#ece9ff;--muted:#a09cc9;--line:#2e2a63;--accent:#9d8fff;--accent-ink:#0f0d24;--good:#4fd1a1;--cycle:#8e7fff;--lat:#3a3573;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.7rem;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px;font-weight:300}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;padding:10px 6px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:stretch}
input[type=time]{flex:1;font:inherit;font-size:2rem;font-weight:600;text-align:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;direction:ltr;min-width:0}
.now{border:1px solid var(--line);background:none;color:var(--accent);font:inherit;border-radius:12px;padding:0 14px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
select{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{width:100%;margin-top:18px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:1.05rem;padding:13px;border-radius:12px;cursor:pointer}
#out{margin-top:22px}
.lead{margin:0 0 12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card.best{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t{font-size:1.7rem;font-weight:600;direction:ltr;unicode-bidi:isolate}
.badge{font-size:.8rem;color:var(--muted)}
.best .badge{color:var(--good);font-weight:600}
.meta{font-size:.88rem;color:var(--muted);margin:2px 0 10px}
.bar{display:flex;gap:3px;height:10px;direction:ltr}
.bar i{display:block;border-radius:3px;background:var(--cycle)}
.bar i.l{background:var(--lat)}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin:14px 0 0}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:6px}
.note{font-size:.85rem;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.theme{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-start:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1rem}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="تبديل المظهر">◐</button>
<main>
  <h1>حاسبة دورات النوم</h1>
  <p class="sub">استيقظ في نهاية دورة نوم كاملة، لا في منتصفها.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-wake" aria-selected="true">أريد أن أستيقظ في…</button>
    <button role="tab" id="t-bed" aria-selected="false">سأنام عند…</button>
  </div>

  <section class="panel">
    <label for="time" id="lbl">وقت الاستيقاظ</label>
    <div class="row">
      <input type="time" id="time" value="06:30">
      <button class="now" id="now" hidden>الآن</button>
    </div>
    <div class="opts">
      <div><label for="lat">الوقت حتى تغفو</label>
        <select id="lat"><option value="5">5 دقائق</option><option value="10">10 دقائق</option><option value="15" selected>15 دقيقة</option><option value="20">20 دقيقة</option><option value="30">30 دقيقة</option></select></div>
      <div><label for="cyc">طول الدورة</label>
        <select id="cyc"><option value="80">80 دقيقة</option><option value="90" selected>90 دقيقة</option><option value="100">100 دقيقة</option></select></div>
    </div>
    <button class="go" id="go">احسب</button>
  </section>

  <div id="out" aria-live="polite"></div>

  <div class="note">الحساب تقريبي: متوسط الدورة 90 دقيقة، لكنه يختلف من شخص لآخر. البالغون يحتاجون عادة من 5 إلى 6 دورات (7.5–9 ساعات). هذه الأداة للتوعية وليست بديلاً عن استشارة الطبيب عند وجود مشكلات نوم مستمرة.</div>
</main>
<script>
(function(){
  var mode='wake',$=function(i){return document.getElementById(i)};
  var QUAL={6:['مثالي','9 ساعات تقريباً'],5:['موصى به','7.5 ساعة تقريباً'],4:['مقبول','6 ساعات تقريباً'],3:['قصير','4.5 ساعة تقريباً']};
  function fmt(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mi=m%60,p=h>=12?'م':'ص',h12=h%12||12;return h12+':'+(mi<10?'0':'')+mi+' '+p}
  function dur(m){var h=Math.floor(m/60),mi=m%60;return h+' س'+(mi?' و '+mi+' د':'')}
  function setMode(m){
    mode=m;$('t-wake').setAttribute('aria-selected',m==='wake');$('t-bed').setAttribute('aria-selected',m==='bed');
    $('lbl').textContent=m==='wake'?'وقت الاستيقاظ':'وقت الذهاب إلى الفراش';
    $('now').hidden=m!=='bed';
    if(m==='bed'){var d=new Date();$('time').value=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
    else $('time').value='06:30';
    $('out').innerHTML='';
  }
  function calc(){
    var v=$('time').value;if(!v){$('out').innerHTML='<p class="lead">أدخل الوقت أولاً.</p>';return}
    var p=v.split(':'),base=+p[0]*60+ +p[1],lat=+$('lat').value,cyc=+$('cyc').value,html='';
    var ns=mode==='wake'?[6,5,4,3]:[3,4,5,6];
    html+='<p class="lead">'+(mode==='wake'?'اذهب إلى الفراش في أحد هذه الأوقات:':'اضبط المنبه على أحد هذه الأوقات:')+'</p>';
    ns.forEach(function(n){
      var total=n*cyc,t=mode==='wake'?base-total-lat:base+lat+total,q=QUAL[n],best=n===5||n===6;
      var bar='<i class="l" style="flex:'+lat+'"></i>';for(var i=0;i<n;i++)bar+='<i style="flex:'+cyc+'"></i>';
      html+='<div class="card'+(best?' best':'')+'"><div class="top"><span class="t">'+fmt(t)+'</span><span class="badge">'+q[0]+'</span></div>'
        +'<div class="meta">'+n+' دورات · نوم فعلي '+dur(total)+'</div><div class="bar" aria-hidden="true">'+bar+'</div></div>';
    });
    html+='<div class="legend"><span><b style="background:var(--lat)"></b>وقت الغفوة</span><span><b style="background:var(--cycle)"></b>دورة نوم</span></div>';
    $('out').innerHTML=html;
  }
  $('t-wake').onclick=function(){setMode('wake')};
  $('t-bed').onclick=function(){setMode('bed')};
  $('now').onclick=function(){var d=new Date();$('time').value=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
  $('go').onclick=calc;
  $('theme').onclick=function(){
    var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.setAttribute('data-theme',dark?'light':'dark');
  };
})();
</script>
</body>
</html>
